name: VOID Son Vardiya Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK manually
        shell: bash
        run: |
          set -euo pipefail

          SDK="$ANDROID_HOME"
          mkdir -p "$SDK"

          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadi"
            exit 1
          fi

          echo "SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"

          curl -fL "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o godot.zip
          curl -fL "$BASE/Godot_v4.3-stable_export_templates.tpz" -o templates.tpz

          unzip -oq godot.zip -d godot-bin
          GODOT="$PWD/godot-bin/Godot_v4.3-stable_linux.x86_64"
          chmod +x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Install export templates
        shell: bash
        run: |
          set -euo pipefail
          DEST="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$DEST" template-files

          unzip -oq templates.tpz -d template-files
          cp template-files/templates/* "$DEST/"

          "$GODOT" --version

      - name: Import project
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          "$GODOT" --headless --editor --path "$PWD" --quit

      - name: Check export preset
        shell: bash
        run: |
          set -euo pipefail
          test -f export_presets.cfg
          grep -q 'name="Android"' export_presets.cfg

      - name: Export Android APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          "$GODOT" --headless --path "$PWD" \
            --export-debug "Android" \
            "$PWD/build/void_son_vardiya_debug.apk"

          test -s build/void_son_vardiya_debug.apk

      - name: Verify APK
        run: unzip -t build/void_son_vardiya_debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOID-Son-Vardiya-APK
          path: build/void_son_vardiya_debug.apk
          if-no-files-found: error
          retention-days: 14
