
name: VOID Son Vardiya - Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Download Godot 4.3
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"

          curl -fL "$BASE/Godot_v4.3-stable_linux.x86_64.zip" \
            -o godot.zip

          curl -fL "$BASE/Godot_v4.3-stable_export_templates.tpz" \
            -o templates.tpz

          unzip -oq godot.zip -d godot-bin
          echo "GODOT=$PWD/godot-bin/Godot_v4.3-stable_linux.x86_64" \
            >> "$GITHUB_ENV"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p templates

          unzip -oq templates.tpz -d templates

          cp templates/templates/* \
            "$HOME/.local/share/godot/export_templates/4.3.stable/"

          chmod +x "$GODOT"
          "$GODOT" --version

      - name: Verify Godot project
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          "$GODOT" --headless --editor --path "$PWD" --quit

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          "$GODOT" --headless --path "$PWD" \
            --export-debug "Android" \
            "$PWD/build/void_son_vardiya_debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/void_son_vardiya_debug.apk
          unzip -t build/void_son_vardiya_debug.apk
          echo "APK successfully generated."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VOID-Son-Vardiya-Android-APK
          path: build/void_son_vardiya_debug.apk
          if-no-files-found: error
          retention-days: 14
