name: NIGHTFALL Son Vardiya APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: "4.3"
      ANDROID_API: "34"
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: ZIP oyun projesini bul ve aç
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip wget
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname '*.zip' ! -name 'Godot_*' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "HATA: Depoda oyun ZIP'i bulunamadı. NIGHTFALL_Son_Vardiya.zip dosyasını depoya yükle."
            exit 1
          fi
          echo "ZIP: $ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/nightfall_project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/nightfall_project"
          PROJECT_FILE="$(find "$RUNNER_TEMP/nightfall_project" -type f -name project.godot -print -quit)"
          if [ -z "$PROJECT_FILE" ]; then
            echo "HATA: ZIP içinde project.godot bulunamadı."
            find "$RUNNER_TEMP/nightfall_project" -maxdepth 3 -type f | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proje: $PROJECT_DIR"

      - name: Android SDK paketlerini kur
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "HATA: Android SDK sdkmanager bulunamadı."
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;34.0.0"

      - name: Godot ve Android şablonlarını indir
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          GODOT_ARCHIVE="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          TEMPLATE_ARCHIVE="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          wget -q "$BASE_URL/$GODOT_ARCHIVE"
          wget -q "$BASE_URL/$TEMPLATE_ARCHIVE"
          unzip -q "$GODOT_ARCHIVE"
          GODOT_BIN="$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          chmod +x "$GODOT_BIN"
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR" "$RUNNER_TEMP/godot_templates"
          unzip -q "$TEMPLATE_ARCHIVE" -d "$RUNNER_TEMP/godot_templates"
          test -s "$RUNNER_TEMP/godot_templates/templates/android_debug.apk"
          cp "$RUNNER_TEMP/godot_templates/templates/"* "$TEMPLATE_DIR/"
          "$GODOT_BIN" --version

      - name: Android Debug APK derle
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          bash scripts_build/build_android.sh debug
          test -s build/NIGHTFALL_Son_Vardiya.apk
          unzip -t build/NIGHTFALL_Son_Vardiya.apk

      - name: APK dosyasını indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTFALL-Son-Vardiya-APK
          path: ${{ env.PROJECT_DIR }}/build/NIGHTFALL_Son_Vardiya.apk
          if-no-files-found: error
          retention-days: 14
