name: NIGHTFALL Android APK

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-22.04
timeout-minutes: 45

env:
  GODOT_VERSION: "4.3"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

steps:
  - name: Depoyu indir
    uses: actions/checkout@v4

  - name: Java 17 kur
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"

  - name: Android SDK hazırla
    uses: android-actions/setup-android@v3

  - name: Android paketlerini yükle
    run: |
      sdkmanager --install \
        "platform-tools" \
        "platforms;android-34" \
        "build-tools;34.0.0"
      yes | sdkmanager --licenses || true

  - name: Godot 4.3 kur
    shell: bash
    run: |
      set -e
      BASE="https://github.com/godotengine/godot/releases/download/4.3-stable"
      wget -q "$BASE/Godot_v4.3-stable_linux.x86_64.zip"
      wget -q "$BASE/Godot_v4.3-stable_export_templates.tpz"
      unzip -q Godot_v4.3-stable_linux.x86_64.zip
      chmod +x Godot_v4.3-stable_linux.x86_64
      echo "GODOT=$PWD/Godot_v4.3-stable_linux.x86_64" >> "$GITHUB_ENV"
      mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
      mkdir -p /tmp/godot-templates
      unzip -q Godot_v4.3-stable_export_templates.tpz -d /tmp/godot-templates
      cp /tmp/godot-templates/templates/* \
        "$HOME/.local/share/godot/export_templates/4.3.stable/"

  - name: Proje klasörünü bul
    shell: bash
    run: |
      set -e
      PROJECT_FILE="$(find . -name project.godot -not -path '*/.godot/*' -print -quit)"
      if [ -z "$PROJECT_FILE" ]; then
        echo "HATA: project.godot bulunamadı."
        exit 1
      fi
      echo "PROJECT_DIR=$(dirname "$PROJECT_FILE")" >> "$GITHUB_ENV"

  - name: Godot kaynaklarını içe aktar
    run: |
      "$GODOT" --headless --editor \
        --path "$PROJECT_DIR" --quit --import

  - name: Android APK oluştur
    shell: bash
    run: |
      set -e
      cd "$PROJECT_DIR"
      mkdir -p build
      "$GODOT" --headless --editor --path . --quit
      "$GODOT" --headless --path . \
        --export-debug "Android Debug" \
        build/NIGHTFALL_Son_Vardiya.apk
      test -s build/NIGHTFALL_Son_Vardiya.apk
      unzip -t build/NIGHTFALL_Son_Vardiya.apk

  - name: APK dosyasını sun
    uses: actions/upload-artifact@v4
    with:
      name: NIGHTFALL-SON-VARDIYA-APK
      path: ${{ env.PROJECT_DIR }}/build/NIGHTFALL_Son_Vardiya.apk
      if-no-files-found: error
      retention-days: 14
